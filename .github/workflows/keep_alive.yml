name: Keep Streamlit App Alive

on:
  schedule:
    # Runs automatically every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          URL="${{ secrets.STREAMLIT_APP_URL }}"
          if [ -z "$URL" ]; then
            URL="https://docquery-ai.streamlit.app"
          fi
          echo "Pinging $URL..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" "$URL")
          echo "HTTP Status Code: $HTTP_STATUS"
          if [[ "$HTTP_STATUS" =~ ^(2|3)[0-9]{2}$ ]]; then
            echo "Successfully pinged Streamlit app (Status $HTTP_STATUS)."
          else
            echo "Failed to ping Streamlit app. Got HTTP status code $HTTP_STATUS"
            exit 1
          fi
